name: ecommerce_app
description: A Flutter E-Commerce Application
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.0

  # State Management
  provider: ^6.1.2

  # Image Picker
  image_picker: ^1.1.2

  # Local Storage
  shared_preferences: ^2.3.2

  # Network Images
  cached_network_image: ^3.4.1

  # Icons
  google_fonts: ^6.2.1



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0



flutter:

  uses-material-design: true





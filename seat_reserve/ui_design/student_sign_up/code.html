<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Student Registration - SeatFlow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#131b2e",
                        "tertiary-container": "#001a42",
                        "tertiary-fixed-dim": "#adc6ff",
                        "surface-bright": "#f8f9ff",
                        "secondary-container": "#6cf8bb",
                        "primary-fixed-dim": "#bec6e0",
                        "surface-container-high": "#dce9ff",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#004395",
                        "on-error-container": "#93000a",
                        "surface-dim": "#cbdbf5",
                        "tertiary": "#000000",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary-fixed": "#d8e2ff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#6ffbbe",
                        "on-secondary-fixed-variant": "#005236",
                        "primary": "#000000",
                        "surface-tint": "#565e74",
                        "error": "#ba1a1a",
                        "on-surface": "#0b1c30",
                        "outline-variant": "#c6c6cd",
                        "primary-fixed": "#dae2fd",
                        "inverse-primary": "#bec6e0",
                        "on-secondary-container": "#00714d",
                        "on-tertiary": "#ffffff",
                        "on-background": "#0b1c30",
                        "on-primary-fixed-variant": "#3f465c",
                        "outline": "#76777d",
                        "on-secondary-fixed": "#002113",
                        "on-primary-container": "#7c839b",
                        "on-tertiary-container": "#3980f4",
                        "inverse-surface": "#213145",
                        "secondary-fixed-dim": "#4edea3",
                        "surface-container-highest": "#d3e4fe",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#001a42",
                        "surface": "#f8f9ff",
                        "secondary": "#006c49",
                        "on-primary-fixed": "#131b2e",
                        "on-surface-variant": "#45464d",
                        "surface-container": "#e5eeff",
                        "surface-variant": "#d3e4fe",
                        "background": "#f8f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "gutter-mobile": "12px",
                        "base": "4px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "sm": "8px",
                        "xl": "32px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "display": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "button": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "button": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]

                }
            }
        }

<style>
        body { background-color: #f8f9ff; color: #0b1c30; }
        .input-glow:focus { box-shadow: 0 0 0 2px rgba(57, 128, 244, 0.1); border-color: #3980f4; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile bg-surface font-body-md text-body-md text-on-surface">
<div class="w-full max-w-md bg-surface-lowest border border-outline-variant rounded-lg p-lg bg-white relative overflow-hidden">
<!-- Subtle decorative top bar -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<!-- Header -->
<div class="text-center mb-xl">
<div class="flex justify-center items-center mb-sm text-primary">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">meeting_room</span>
</div>
<h1 class="font-display text-display text-primary mb-xs">SeatFlow</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Create your student account</p>
</div>
<!-- Warning Message -->
<div class="mb-lg p-sm bg-surface-container-low border border-primary-fixed-dim rounded flex items-start space-x-sm">
<span class="material-symbols-outlined text-on-tertiary-container mt-1 text-[20px]">info</span>
<p class="font-body-sm text-body-sm text-on-surface">
<strong>Important:</strong> Your account requires teacher approval before you can reserve seats.
            </p>
</div>
<!-- Form -->
<form class="space-y-md">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="fullName">Full Name</label>
<input class="w-full h-11 px-sm border border-outline-variant rounded input-glow focus:outline-none bg-surface font-body-md text-body-md text-on-surface" id="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="studentId">Student ID</label>
<input class="w-full h-11 px-sm border border-outline-variant rounded input-glow focus:outline-none bg-surface font-label-caps text-label-caps text-on-surface" id="studentId" placeholder="STU-84920" required="" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="email">Email Address</label>
<input class="w-full h-11 px-sm border border-outline-variant rounded input-glow focus:outline-none bg-surface font-body-md text-body-md text-on-surface" id="email" placeholder="jane.doe@school.edu" required="" type="email"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="password">Password</label>
<input class="w-full h-11 px-sm border border-outline-variant rounded input-glow focus:outline-none bg-surface font-body-md text-body-md text-on-surface" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="pt-sm">
<button class="w-full h-11 bg-primary text-on-primary font-button text-button rounded hover:bg-surface-tint transition-colors active:scale-95 flex items-center justify-center space-x-2" type="submit">
<span>Submit Registration</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer -->
<div class="mt-lg text-center font-body-sm text-body-sm text-on-surface-variant">
            Already have an account? <a class="text-on-tertiary-container hover:underline" href="#">Sign in</a>
</div>
</div>
</body></html>
